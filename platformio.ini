; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-epaper-397]
; pioarduino = Arduino-ESP32 core 3.x (the official platform is stuck on 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash: 16MB QIO
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; PSRAM: 8MB octal
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over the native USB-C port

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; readable crash backtraces
upload_speed = 921600

lib_deps =
    lewisxhe/SensorLib@^0.3.1
    bblanchon/ArduinoJson@^7.4.2
    lewisxhe/XPowersLib@^0.3.0
    adafruit/Adafruit GFX Library@^1.12.1
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0