openapi: 3.0.3
info:
  title: knowpod-service API
  version: 0.11.1
  description: |
    Backend for the knowpod AI audio recorder.

    **Device API** — recorders push WAV recordings with a resumable upload protocol:

    1. `POST /uploads` with the device's own `recordingId`, the total `size` and the
       `sha256` of the WAV file. Repeating the call with the same `recordingId` returns the
       existing upload (idempotent).
    2. `PATCH /uploads/{uploadId}` with an `Upload-Offset` header and a chunk of bytes as
       body. The whole file may be sent in one PATCH. After a dropped connection,
       `GET /uploads/{uploadId}` returns the offset to resume from.
    3. When the last byte arrives, the checksum and WAV header are verified and the status
       becomes `received`. The recording is then transcoded to FLAC and archived in S3 in
       the background (status `stored`).

    **Pocket** — each user connects their own Pocket recorder (heypocketai.com): its webhook
    (`POST /webhooks/pocket/{webhookId}`, URL from `GET /me/pocket`) announces recordings,
    whose audio is then downloaded with the user's Pocket API key and archived like device
    uploads. The desktop app also copies new recordings straight from a Pocket recorder
    plugged in by USB (`POST /me/pocket/device/check`, `POST /me/pocket/device/files`). WAV and
    MP3 files can also be uploaded from the browser (`POST /recordings`).

    **reMarkable documents** — users pair their reMarkable cloud account with a one-time code
    (`POST /me/remarkable/pair`). All its documents (except those in the trash and those whose
    name is in `ignoredNames`, set with `PATCH /me/remarkable`) are then
    imported as notes into the user's folder "reMarkable" (created when missing) (`type: document`) every few minutes or on `POST /me/remarkable/pull`,
    and imported again when they change. Handwritten notebooks are rendered to PDF; PDFs and
    EPUBs are kept as they are (`GET /recordings/{id}/file`). The text read from the pages
    (handwriting and typed text) becomes the note's `transcript` and is summarized. These notes are read-only.
    The other way, text notes put into the folder "reMarkable" (or a folder inside it) are sent to the tablet as
    EPUBs shortly after they change, and follow the note's title, text and folder (`tablet` on the note); a note
    that leaves the folder or goes into the trash has its copy put into the tablet's trash. Nothing else is written
    to the cloud.

    **Text notes** — besides audio recordings, notes can be plain Markdown text written in the
    web UI (`POST /recordings/text`, `type: text`). They skip transcription and summaries.

    **Boards** — kanban boards (`POST /recordings/board`, `type: board`) show the notes of a
    folder, a label or a saved filter as cards in columns ("Todo", "In Progress", "Done" to
    start with).

    **Saved filters** — searches such as `label:Task & due:week & !done` are saved with a
    name (`/filters`) and can be pinned to the notes list. The web app evaluates their query.

    **Tasks** — notes labeled `task` have a check mark (`PUT /recordings/{id}/done`), a due
    date with an optional time, repeat rule and reminder (`PUT /recordings/{id}/due`) and a
    priority (`PUT /recordings/{id}/priority`). Setting a date or priority labels a note as a
    task. Checking off a recurring task moves it to its next date. Dates are meant in the
    user's time zone (`PUT /me/preferences`). Summaries list the **action items** found in the
    conversation (`summary.actionItems`); `POST /recordings/{id}/action-items/{itemId}/task`
    turns one into a task under the note.

    **Time tracking** — tasks get an estimate in minutes (`PUT /recordings/{id}/estimate`). A
    timer (`/timer`, one per user, optionally a focus session of a few minutes that stops by
    itself) logs the time spent on a note; the time log of a period is listed and exported as
    CSV (`/time-entries`). Each note keeps its logged total (`trackedSeconds`).

    **Calendar feed** — `POST /me/calendar` makes a secret iCalendar link
    (`GET /calendar/{token}.ics`) listing the open tasks with dates, for calendar apps to
    subscribe to.

    **Notifications** — reminders are sent through Web Push to the browsers and installed apps
    the user turned them on in (`/me/notifications`).

    **Ask** — `POST /ask` answers a question from the user's notes, citing them: the summary
    model picks the fitting notes from a catalog of them and names words to look up in the
    full texts and transcripts, then answers from the notes found.

    **Briefings** — users get a daily briefing (on unless turned off) and can turn on a weekly
    review (`/me/briefing`), with the tasks due and overdue, what came in (with a digest by
    the summary model) and open action items, announced by a notification. The daily
    briefing is shown on the web app's home page (`/me/briefing/today`); the weekly review is
    a note in the folder "Briefings".

    **Browser uploads** — besides audio, photos (e.g. of a whiteboard) and PDFs are uploaded
    with `POST /recordings`; they become documents whose text is read by the document model.
    Voice memos recorded in the web app come the same way, with their highlights.

    **AI processing** — every archived recording is transcribed and then summarized through
    OpenRouter, with the API key and models set by an administrator
    (`PUT /admin/settings/openrouter`); audio can instead be transcribed by ElevenLabs, which
    tells speakers apart by their voices. Recordings wait in `stored` until that is configured.

    **Users** — people sign in with email and password (HttpOnly session cookie). Every
    recording and device belongs to a user, who only sees their own. Administrators manage
    users (`/admin/users`) and the AI settings. The built-in admin is `ADMIN_EMAIL`; its
    password is `ADMIN_PASSWORD` until one is set in the UI.

    **Scripts** can call every endpoint except the device API with `ADMIN_TOKEN` as bearer
    token; they act as the built-in admin and see all users' data.
servers:
  - url: /api/v1
security: []
tags:
  - name: Service
    description: Service information and this API description.
  - name: Device uploads
    description: Used by recorder gadgets, authenticated with their device token.
  - name: Web UI sign-in
    description: Email/password sign-in for the web UI, with a session cookie.
  - name: Your account
    description: The signed-in user's Pocket and reMarkable integrations and AI status.
  - name: Devices
    description: Your recorder gadgets. ADMIN_TOKEN sees every user's.
  - name: Recordings
    description: Your conversations, their audio, and uploads from the browser. ADMIN_TOKEN sees every user's.
  - name: Integrations
    description: Webhooks from external recorders.
  - name: Themes
    description: Summary themes that define how summaries are structured. Built-in ones plus your own.
  - name: Labels
    description: Labels for notes, with colors. The built-in "task" label plus your own.
  - name: Folders
    description: Folders the notes are sorted into; folders can hold folders.
  - name: Tasks
    description: Due dates, repeat rules, reminders and priorities of notes labeled as tasks, and tasks made from action items.
  - name: Sharing
    description: |
      Share a note, together with everything under it, with other users. Viewers see the
      notes; editors also change their title, text and task fields and add, move and delete
      the notes under them. Each member files a shared note for themselves: their own folder
      (for a note shared by itself), labels, order and reminders. Only the owner shares,
      deletes the shared note itself, and sends it back into processing.

      A folder is shared the same way, together with everything in it: its notes (with the
      notes under them) and its folders. Its users see it in their folders (at their top
      level) with what is in it; editors also add notes and folders to it, which belong to its
      owner, and move its notes between the folders shared with them.

      Every note carries a `version`, counted up by each change. Changes made at the same time
      never undo each other: a text edit made on an older `revision` is refused with 409
      `changed` when `baseRevision` is given. `GET /me/events` tells open apps about changes
      as they happen.
  - name: Notifications
    description: Task reminders sent through Web Push to your browsers and installed apps.
  - name: Filters
    description: Saved searches, pinned to the notes list and shown by boards.
  - name: Time tracking
    description: Estimates, the timer and focus sessions, and the time log of your notes.
  - name: Calendar
    description: A read-only iCalendar feed of your tasks with dates.
  - name: Ask
    description: Questions answered from your notes, with the notes cited.
  - name: Briefings
    description: Your daily briefing and weekly review.
  - name: MCP server
    description: |
      Access for AI assistants (Claude, ChatGPT, …) through the MCP server at `/mcp`, outside
      this API: a Model Context Protocol server (Streamable HTTP, stateless JSON responses)
      whose tools search, read, create and change your notes and tasks. Assistants sign in
      through OAuth 2.1 (MCP authorization: protected resource metadata at
      `/.well-known/oauth-protected-resource/mcp`, authorization server metadata at
      `/.well-known/oauth-authorization-server`, dynamic client registration, PKCE), or with
      your own MCP access token, `Authorization: Bearer kpm_…`.
  - name: Backup
    description: |
      A backup of your own notes and content, and a restore from one. It is a zip file in the
      layout of the admin backup (`db/`, `objects/`, and a `manifest.json` that comes last), with
      only what you own, so you can keep it, or restore it into a fresh account. Other users'
      data is never part of it, and a restore never touches it.
  - name: "Admin: users"
    description: Create, change and delete users. Administrators only.
  - name: "Admin: AI settings"
    description: OpenRouter API key and the models used to transcribe and summarize recordings, and the optional ElevenLabs transcription. Administrators only.
  - name: "Admin: backup"
    description: |
      A full backup of everything in the system, and a full restore from one. Administrators
      only (or `ADMIN_TOKEN`). A backup is a zip file with the database (every collection except
      the short-lived sessions, as raw BSON in `db/`), every object of the S3 bucket (`objects/`)
      and a `manifest.json`, which comes last: a download that was cut off isn't a valid backup.
      The data isn't frozen while the backup is written; the database goes first and the objects
      after it, so every object the notes refer to is included.
paths:
  /info:
    get:
      tags: ["Service"]
      summary: Service information
      responses:
        "200":
          description: Service name and API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: knowpod-service }
                  apiVersion: { type: string, example: v1 }

  /openapi.yaml:
    get:
      tags: ["Service"]
      summary: This API description (OpenAPI 3, YAML)
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /openapi.json:
    get:
      tags: ["Service"]
      summary: This API description (OpenAPI 3, JSON)
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/json:
              schema: { type: object }

  /auth/login:
    post:
      tags: ["Web UI sign-in"]
      summary: Sign in to the web UI
      description: Sets the `knowpod_session` cookie. Limited to 10 requests per minute per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { schema: { type: string, example: knowpod_session=…; Path=/; HttpOnly; SameSite=Strict } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "401":
          description: Invalid email or password
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { description: Too many login attempts }

  /auth/logout:
    post:
      tags: ["Web UI sign-in"]
      summary: Sign out
      description: Ends the session (if any) and clears the cookie.
      responses:
        "204": { description: Signed out }

  /auth/me:
    get:
      tags: ["Web UI sign-in"]
      summary: The signed-in account
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "401": { $ref: "#/components/responses/Error" }

  /auth/password:
    put:
      tags: ["Web UI sign-in"]
      summary: Change the password
      description: |
        Stores the new password, which from then on replaces the default password from the
        environment. All other sessions of the account are ended.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Password changed }
        "400":
          description: New password too short or too long
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: Current password is wrong
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /uploads:
    post:
      tags: ["Device uploads"]
      summary: Create (or resume) an upload
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
      responses:
        "201":
          description: Upload created
          headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } }
        "200":
          description: An upload with this recordingId already exists; its current state
          headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The recordingId exists with a different size or checksum
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/Error" }

  /uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    get:
      tags: ["Device uploads"]
      summary: Upload state (offset to resume from)
      security: [{ deviceToken: [] }]
      responses:
        "200":
          description: Current state
          headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: ["Device uploads"]
      summary: Append a chunk
      description: |
        Appends the body at `Upload-Offset`, which must equal the current offset. Bytes
        received before a dropped connection are kept. Sending a chunk to a completed upload
        is a no-op that returns its final state.
      security: [{ deviceToken: [] }]
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk stored. `status` is `received` once the file is complete and verified.
          headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Offset mismatch; resume from `offset`
          headers: { Upload-Offset: { $ref: "#/components/headers/UploadOffset" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: The chunk would exceed the declared size
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            Checksum mismatch (the upload is reset to offset 0; resend) or the file is not a
            supported WAV (the recording is marked `failed`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/pocket:
    get:
      tags: ["Your account"]
      summary: Your Pocket integration
      description: Your webhook path and whether the secret and API key are set (their values are never returned).
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { $ref: "#/components/schemas/PocketSettings" } } }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: ["Your account"]
      summary: Change your Pocket integration
      description: Fields left out stay unchanged; empty strings remove the value.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookSecret: { type: string, description: Signing secret shown by Pocket when the webhook is created }
                apiKey: { type: string, example: pk_… }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/PocketSettings" } } }

  /me/pocket/device/check:
    post:
      tags: ["Your account"]
      summary: Which files of a Pocket recorder are new
      description: |
        A Pocket recorder plugged in by USB keeps its recordings as MP3 files named by when they
        started, in UTC (`RECORD/2026-10-2/20261002090356.mp3`). The desktop app sends the names
        of the files it finds and gets back those that aren't notes yet: neither copied before
        (also when the note is in the trash) nor announced by the Pocket webhook with a start
        within 30 seconds. Names that aren't recordings are left out.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, maxItems: 10000, items: { type: string, example: 20261002090356.mp3 } }
      responses:
        "200":
          description: The new files, in the order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /me/pocket/device/files:
    post:
      tags: ["Your account"]
      summary: Copy a recording from a Pocket recorder
      description: |
        Stores an MP3 file of a Pocket recorder, sent as the raw request body, as a note in the
        folder "Pocket AI" (`source: pocket`), recorded at the time in its name. It is
        transcribed and summarized like other recordings.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-Filename
          in: header
          required: true
          description: URL-encoded file name, e.g. "20261002090356.mp3"
          schema: { type: string }
      requestBody:
        required: true
        content:
          audio/mpeg: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Stored; processing starts
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The recording already is a note
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/Error" }
        "415":
          description: Not an MP3 file
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/remarkable:
    get:
      tags: ["Your account"]
      summary: Your reMarkable link
      description: Whether a reMarkable cloud account is paired, and the outcome of the last pull.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Link
          content: { application/json: { schema: { $ref: "#/components/schemas/RemarkableSettings" } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: ["Your account"]
      summary: Change your reMarkable settings
      description: |
        Sets the names of documents that aren't imported (compared without case, with white
        space collapsed; at most 200 names of up to 200 characters). Notes already imported
        from such documents stay but are no longer updated.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ignoredNames: { type: array, items: { type: string }, example: ["Quick sheets"] }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/RemarkableSettings" } } }
        "400":
          description: Too many or too long names (`invalid_input`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: No account paired (`not_paired`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: ["Your account"]
      summary: Unpair your reMarkable account
      description: |
        Forgets the pairing; imported notes stay. The paired app remains listed among the
        account's devices at my.remarkable.com until it is removed there.
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Unpaired }

  /me/remarkable/pair:
    post:
      tags: ["Your account"]
      summary: Pair a reMarkable account
      description: Pairs with the one-time code from `connectUrl` (https://my.remarkable.com/device/browser/connect). Pairing again replaces the link.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: abcdefgh, description: The 8-character one-time code }
      responses:
        "200":
          description: Paired
          content: { application/json: { schema: { $ref: "#/components/schemas/RemarkableSettings" } } }
        "400":
          description: Malformed or refused code (`invalid_input`, `invalid_pairing_code`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502":
          description: The reMarkable cloud could not be reached (`remarkable_unavailable`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/remarkable/pull:
    post:
      tags: ["Your account"]
      summary: Import new and changed documents now
      description: |
        Sends the changed text notes of the folder "reMarkable" to the tablet first. Then reads all documents of the account (except the trash and ignored names) and queues new documents
        and documents whose content changed. New notes go into the folder "reMarkable". Pulls also run automatically
        (`REMARKABLE_PULL_INTERVAL`, default 15 minutes).
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Pulled; `lastResult` tells what was found
          content: { application/json: { schema: { $ref: "#/components/schemas/RemarkableSettings" } } }
        "409":
          description: No account paired (`not_paired`), or the cloud no longer accepts the pairing (`pairing_revoked`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502":
          description: The reMarkable cloud could not be reached (`remarkable_unavailable`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /ai/status:
    get:
      tags: ["Your account"]
      summary: Whether AI processing is configured
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription: { type: boolean }
                  summary: { type: boolean }

  /ai/models:
    get:
      tags: ["Your account"]
      summary: Models available for transcription and summaries
      description: From OpenRouter's model list. Transcription needs audio input; summaries need text input. Any signed-in user may list them (to pick a summary model per recording).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Model options
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcription: { type: array, items: { $ref: "#/components/schemas/ModelOption" } }
                  summary: { type: array, items: { $ref: "#/components/schemas/ModelOption" } }
                  document: { type: array, items: { $ref: "#/components/schemas/ModelOption" }, description: Models that take images (for reading documents) }
        "502":
          description: OpenRouter could not be reached
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /ai/languages:
    get:
      tags: ["Your account"]
      summary: Languages a summary can be written in
      description: Language tags accepted as `language` in summary options, besides `auto` (the transcript's language).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Language tags
          content:
            application/json:
              schema: { type: array, items: { type: string, example: de-DE } }

  /me/preferences:
    put:
      tags: ["Your account"]
      summary: Change your preferences
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, enum: ["", en, de], description: Web UI language; empty follows the browser }
                appearance: { type: string, enum: ["", light, dark], description: Web UI color scheme; empty follows the system }
                timeZone: { type: string, example: Europe/Berlin, description: IANA time zone task dates and reminders are meant in; empty is UTC. Changing it moves pending reminders. }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/Error" }

  /labels:
    get:
      tags: ["Labels"]
      summary: List labels
      description: The built-in labels (`task`) followed by your own, by name.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Label" } }
    post:
      tags: ["Labels"]
      summary: Create a label
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LabelInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /labels/{labelId}:
    parameters:
      - { name: labelId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Labels"]
      summary: Rename or recolor a label
      description: Built-in labels can't be changed.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LabelInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Label" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Labels"]
      summary: Delete a label
      description: Takes the label off all your notes. Built-in labels can't be deleted.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /folders:
    get:
      tags: ["Folders"]
      summary: List folders
      description: |
        Your folders, by name, then the folders shared with you with the folders in them (a
        shared folder has `parentId` only when the folder it is in is shared with you, too).
        Build the tree from `parentId`; within each folder show the folders with a `position`
        first, by it, then the others by name. `access` says what you may do in a folder.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Folder" } }
    post:
      tags: ["Folders"]
      summary: Create a folder
      description: |
        Creates a folder of the user, or, in a folder shared with the user as an editor
        (`parentId`), a folder of that folder's owner, shared like it.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FolderInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /folders/order:
    put:
      tags: ["Folders"]
      summary: Order folders
      description: |
        Puts folders that are all in the same place (the same parent folder, or the top level)
        in the order given, setting their `position` from 1 up. Folders there that aren't
        listed follow them, by name. A folder moved elsewhere loses its position.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 2000, items: { type: string } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /folders/{folderId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Folders"]
      summary: Rename or move a folder
      description: Moves the folder into `parentId` (empty for the top level). A folder can't go into itself or one of its own folders.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FolderInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Folder" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Folders"]
      summary: Delete a folder
      description: The folder's notes and folders move up into the folder it was in; no note is deleted. The folder of a paired reMarkable's documents (`remarkable`) can't be deleted.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /folders/{folderId}/shares:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
    get:
      tags: ["Sharing"]
      summary: Who a folder is shared with
      description: Members marked `inherited` have the folder through a folder it is in.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: The folder's owner and members
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Sharing"]
      summary: Share a folder
      description: |
        Shares the folder and everything in it (its notes with the notes under them, and its
        folders) with the user signing in with `email`, or changes their role. Only the owner
        shares. Boards in the folder aren't shared.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200":
          description: Shared
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /folders/{folderId}/shares/{userId}:
    parameters:
      - { name: folderId, in: path, required: true, schema: { type: string } }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Sharing"]
      summary: Change a folder member's role
      description: Only for users the folder is shared with directly (not through a folder it is in).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200":
          description: Changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Sharing"]
      summary: Stop sharing a folder with a user
      description: |
        The owner can take anyone off a folder shared with them directly; members can take
        themselves off (leave the folder), which answers 204.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: No longer shared with the user
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "204": { description: You left the folder }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /themes:
    get:
      tags: ["Themes"]
      summary: List summary themes
      description: The built-in themes (`builtIn`, fixed IDs such as `auto`, `meeting`) followed by your own.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Themes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Theme" } }
    post:
      tags: ["Themes"]
      summary: Create a theme
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThemeInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Theme" } } }
        "400": { $ref: "#/components/responses/Error" }

  /themes/{themeId}:
    parameters:
      - { name: themeId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Themes"]
      summary: Change one of your themes, or customize a built-in one
      description: |
        For a built-in theme ID (e.g. `meeting`) this saves your own version, which replaces
        the built-in theme for you only (`customized: true` in the list).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThemeInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Theme" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Themes"]
      summary: Delete one of your themes, or reset a customized built-in one
      description: |
        Summaries made with a deleted theme keep their text; regenerating them uses the Auto
        theme. For a built-in theme ID this removes your version, restoring the default.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /uploads/{uploadId}/highlights:
    put:
      tags: ["Device uploads"]
      summary: Set the highlights of a recording
      description: |
        Replaces the highlights (moments the user marked while recording). Can be called at
        any time after the upload was created. A summary that already exists is not
        regenerated automatically; new summaries include a "Highlights" section.
      security: [{ deviceToken: [] }]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [highlights]
              properties:
                highlights: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/HighlightInput" } }
      responses:
        "200":
          description: Saved (sorted, duplicates removed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
                  highlights: { type: array, items: { $ref: "#/components/schemas/Highlight" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhooks/pocket/{webhookId}:
    post:
      tags: ["Integrations"]
      summary: Webhook for Pocket (heypocketai.com)
      description: |
        Each user has their own webhook URL (see `GET /me/pocket`) to configure in their
        Pocket app. Requests are authenticated by their signature: `X-HeyPocket-Signature`
        must be the hex HMAC-SHA256 of `<X-HeyPocket-Timestamp>.<raw body>`, keyed with that
        user's webhook signing secret, and the timestamp (Unix milliseconds) must be within
        5 minutes of the server clock.

        Every event that names a recording queues it once for the user (repeated deliveries
        are ignored); `recording.deleted` is ignored. The audio is then downloaded in the
        background with the user's Pocket API key and archived in S3.
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - { name: X-HeyPocket-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-HeyPocket-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, example: recording.created }
                timestamp: { type: string, format: date-time }
                recording:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    duration: { type: number }
                    recordingAt: { type: string, format: date-time }
      responses:
        "200":
          description: Accepted. `status` is `queued`, `duplicate` or `ignored`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [queued, duplicate, ignored] }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Missing, wrong or expired signature
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/Error" }
        "404":
          description: Unknown webhook URL
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The user hasn't set both the webhook secret and the API key
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /devices:
    post:
      tags: ["Devices"]
      summary: Register a device for the signed-in user
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Device registered. The token is only returned here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/Device" }
                  token: { type: string, example: kpd_Zx3... }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      tags: ["Devices"]
      summary: List your devices
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: All devices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }

  /devices/{deviceId}/token:
    post:
      tags: ["Devices"]
      summary: Issue a new device token
      description: |
        Replaces the device's token, e.g. when the old one was lost. The old token stops
        working immediately. The device keeps its ID and recordings. The new token is only
        returned here.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: "#/components/schemas/Device" }
                  token: { type: string, example: kpd_Zx3... }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          description: Unknown or removed device
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /devices/{deviceId}:
    delete:
      tags: ["Devices"]
      summary: Remove (revoke) a device
      description: The device's token stops working permanently. Its recordings are kept.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /recordings:
    get:
      tags: ["Recordings"]
      summary: List your recordings, newest first
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: deviceId, in: query, schema: { type: string } }
        - { name: number, in: query, description: The note with this number (see `number`), schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - name: full
          in: query
          description: Include transcript and summary text (left out by default to keep lists small)
          schema: { type: boolean }
        - name: trash
          in: query
          description: '"only" lists the notes in the trash, "any" all notes; by default notes in the trash are left out'
          schema: { type: string, enum: [only, any] }
      responses:
        "200":
          description: Recordings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Recording" } }
    post:
      tags: ["Recordings"]
      summary: Upload an audio file, a photo or a PDF
      description: |
        Uploads a WAV (integer PCM) or MP3 file as the raw request body. It is processed like
        other recordings: WAV is archived as FLAC, MP3 as it is, and both are transcribed
        and summarized. The format is detected from the content, not the file name.

        A photo (JPEG, PNG, WebP or GIF, up to 20 MB) or PDF becomes a document (`type:
        document`, file at `GET /recordings/{id}/file`): the document model writes down the
        text it shows (a photo without text is described), which is then summarized. HEIC
        photos are refused; convert them to JPEG first.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-Filename
          in: header
          description: URL-encoded original file name; becomes the title until the summary has one
          schema: { type: string }
        - name: X-Recorded-At
          in: header
          description: When the audio was recorded (RFC 3339), e.g. the file's modification time
          schema: { type: string, format: date-time }
        - name: X-Recorder
          in: header
          description: '"1" for a voice memo recorded in the web app (`source: recorder`); only audio'
          schema: { type: string, enum: ["1"] }
        - name: X-Highlights
          in: header
          description: The moments marked while recording, as comma-separated offsets in milliseconds, e.g. "12500,63000"
          schema: { type: string }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary } }
          audio/mpeg: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Stored; processing starts
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415":
          description: Not a WAV or MP3 file, a supported photo or a PDF
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: A WAV file that isn't integer PCM
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/text:
    post:
      tags: ["Recordings"]
      summary: Create a text note
      description: |
        Creates a note of type `text`: a title and Markdown text written by you, without audio,
        transcript or processing. The text is kept in `summary`, so the note is read, edited
        (`PUT /recordings/{recordingId}/summary`), downloaded and deleted like a recording's summary.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, markdown]
              properties:
                title: { type: string, maxLength: 200 }
                markdown: { type: string, maxLength: 100000 }
                parentId: { type: string, description: Creates the note as a sub-note of this note }
                folderId: { type: string, description: Creates the note in this folder (ignored for a sub-note); empty for the top level }
                task: { type: boolean, description: Labels the note as a task (implied by `due` or `priority`) }
                due: { $ref: "#/components/schemas/Due" }
                priority: { $ref: "#/components/schemas/Priority" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /recordings/board:
    post:
      tags: ["Recordings"]
      summary: Create a board
      description: |
        Creates a note of type `board`: a kanban board of the notes in a folder or with a label
        (its `scope`), sorted into columns. Notes in the scope that are in no column are shown in
        the first one. Without columns the board gets "Todo", "In Progress" and "Done". Like a
        text note, its title is kept in `summary` (rename it with
        `PUT /recordings/{recordingId}/summary`); it is labeled, moved and deleted like any note.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                board: { $ref: "#/components/schemas/Board" }
                folderId: { type: string, description: Creates the board in this folder; empty for the top level }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /recordings/order:
    put:
      tags: ["Recordings"]
      summary: Order notes
      description: |
        Puts notes that are all in the same place (the same folder, or under the same note) in
        the order given, setting their `position` from 1 up. Notes there that aren't listed
        follow them, by title. A note moved elsewhere loses its position.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 2000, items: { type: string } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/trash:
    delete:
      tags: ["Recordings"]
      summary: Empty the trash
      description: Deletes all your notes in the trash for good.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }

  /recordings/{recordingId}:
    delete:
      tags: ["Recordings"]
      summary: Move a note to the trash, or delete it
      description: |
        Moves the note to the trash (its sub-notes move up to where it was). Notes stay in the
        trash for 14 days and are then deleted for good. With `permanent`, the note, its
        transcript and summary, and its audio are removed from storage right away.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: permanent, in: query, description: Delete for good instead of moving to the trash, schema: { type: boolean } }
      responses:
        "200":
          description: Moved to the trash
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "204": { description: Deleted for good }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: ["Recordings"]
      summary: Get a recording
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recording
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/audio:
    get:
      tags: ["Recordings"]
      summary: Stream or download the archived audio
      description: |
        FLAC for uploaded WAV recordings; the original format (e.g. MP3, M4A) for recordings
        fetched from Pocket. Supports a single `Range` for seeking; `?download=1` sends it as
        an attachment.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: boolean } }
        - { name: Range, in: header, schema: { type: string, example: bytes=0-1023 } }
      responses:
        "206": { description: Partial content for a Range request }
        "416": { description: Range outside the file }
        "200":
          description: Audio
          content:
            audio/flac:
              schema: { type: string, format: binary }
            audio/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Not archived yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/file:
    get:
      tags: ["Recordings"]
      summary: Show or download a document
      description: |
        The PDF of a reMarkable document (notebooks rendered from their pages) or its EPUB.
        Supports a single `Range`; `?download=1` sends it as an attachment.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, schema: { type: boolean } }
        - { name: Range, in: header, schema: { type: string, example: bytes=0-1023 } }
      responses:
        "206": { description: Partial content for a Range request }
        "416": { description: Range outside the file }
        "200":
          description: Document
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/epub+zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Not stored yet, or the note is not a document
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/images:
    post:
      tags: ["Recordings"]
      summary: Add a picture to a note's text
      description: |
        Stores a picture (JPEG, PNG, WebP or GIF, up to 10 MB) sent as the request body, for
        showing in the note's Markdown text. Refer to it with `![](url)` using the returned
        `url`. The web app calls this when a picture is pasted or dropped into the editor.
        Needs an editor of the note; the note's revision doesn't change. Pictures are deleted
        with the note.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, url]
                properties:
                  id: { type: string }
                  url: { type: string, description: 'Path of the picture, e.g. /api/v1/recordings/{id}/images/{imageId}' }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/images/{imageId}:
    get:
      tags: ["Recordings"]
      summary: Show a picture of a note's text
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The picture
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/attachments:
    post:
      tags: ["Recordings"]
      summary: Attach a file to a note
      description: |
        Stores a file of any type (up to 50 MB, at most 100 per note) sent as the request body
        and lists it in the note's `attachments`, which the web app shows in the sidebar. Needs
        an editor of the note; the note's revision doesn't change. Attachments are deleted with
        the note.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: false, schema: { type: string }, description: The file's name }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, name, contentType, size]
                properties:
                  id: { type: string }
                  name: { type: string }
                  contentType: { type: string }
                  size: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/attachments/{attachmentId}:
    get:
      tags: ["Recordings"]
      summary: Download an attached file
      description: Always sent as a download with the media type application/octet-stream.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: attachmentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Recordings"]
      summary: Remove an attached file
      description: Needs an editor of the note.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: attachmentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The note without the file
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/restore:
    post:
      tags: ["Recordings"]
      summary: Restore a note from the trash
      description: Takes the note out of the trash. When the note it was a sub-note of is gone or in the trash, it comes back at the top level.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Restored
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/retranscribe:
    post:
      tags: ["Recordings"]
      summary: Transcribe again
      description: Discards the transcript and summary; the recording is transcribed (a document read) and summarized anew.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Queued
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The audio has not been archived yet, or the note is a text note
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/resummarize:
    post:
      tags: ["Recordings"]
      summary: Summarize again
      description: |
        Discards the summary and summarizes the existing transcript anew. An optional body
        sets new summary options, which are kept for later regenerations.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/SummaryOptions" } } }
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Queued
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The recording has no transcript yet, or the note is a text note
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/transcript:
    get:
      tags: ["Recordings"]
      summary: Download the transcript
      description: A text file (with `[m:ss]` time stamps per speaker turn for recordings transcribed since they were introduced), or JSON with `?format=json`.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [text, json], default: text } }
      responses:
        "200":
          description: The transcript
          content:
            text/plain: { schema: { type: string } }
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  model: { type: string }
                  createdAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: No transcript yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/summary:
    get:
      tags: ["Recordings"]
      summary: Download the summary
      description: A Markdown file with the title as the first heading, or JSON with `?format=json`.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [markdown, json], default: markdown } }
      responses:
        "200":
          description: The summary
          content:
            text/markdown: { schema: { type: string } }
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  markdown: { type: string }
                  model: { type: string }
                  language: { type: string }
                  themeId: { type: string }
                  themeName: { type: string }
                  editedAt: { type: string, format: date-time }
                  createdAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: No summary yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    put:
      tags: ["Recordings"]
      summary: Edit the summary
      description: |
        Replaces the summary's title and Markdown text with your version and sets
        `summary.editedAt`. Regenerating the summary later replaces the edits.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, markdown]
              properties:
                title: { type: string, maxLength: 200 }
                markdown: { type: string, maxLength: 100000 }
                baseRevision: { type: integer, format: int64, description: 'The note''s `revision` the edit was made on. When the title or text changed since (someone else edited them), the edit is refused with 409 `changed` instead of undoing theirs.' }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The recording has no summary yet (`not_ready`), or its text changed since `baseRevision` (`changed`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/shares:
    get:
      tags: ["Sharing"]
      summary: Who a note is shared with
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The note's owner and members
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Sharing"]
      summary: Share a note
      description: |
        Shares the note and everything under it with the user signing in with `email`, or
        changes their role. Only the owner shares; boards and notes in the trash can't be
        shared.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200":
          description: Shared
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/shares/{userId}:
    put:
      tags: ["Sharing"]
      summary: Change a member's role
      description: Only for users the note is shared with directly (not through a note it is under).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200":
          description: Changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Sharing"]
      summary: Stop sharing a note with a user
      description: |
        The owner can take anyone off a note shared with them directly; members can take
        themselves off (leave the note), which answers 204.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: No longer shared with the user
          content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } }
        "204": { description: You left the note }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/speakers:
    put:
      tags: ["Recordings"]
      summary: Name several speakers of the transcript
      description: |
        Names speakers like `POST /recordings/{recordingId}/speakers/rename`, several at once. With
        `resummarize`, the summary is not edited but made again from the renamed transcript, so
        it is written with the names: the note goes back to `transcribed` and the summary it
        replaces is kept as an earlier version. Not while the note is being processed. Needs
        editing rights; counts up the note's `revision`.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: Applied in order. A name can't be the label of another speaker renamed in the same request.
                  items:
                    type: object
                    required: [from, to]
                    properties:
                      from: { type: string, description: The speaker's label in the transcript, example: "Speaker 1" }
                      to: { type: string, maxLength: 40, description: The speaker's name (no colons or brackets), example: "Anna" }
                resummarize: { type: boolean, description: Make the summary again with the names }
      responses:
        "200":
          description: Named; with `resummarize`, the note is queued for a new summary
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400":
          description: The transcript has no such speaker, or a name isn't valid
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The note has no transcript with speakers, or is being processed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/speakers/rename:
    post:
      tags: ["Recordings"]
      summary: Name a speaker of the transcript
      description: |
        Replaces a speaker's label (e.g. "Speaker 1") where it starts the speaker's lines in the
        transcript, and where the summary and its action items mention it, with a name. Naming a
        speaker like another one merges the two. `summary.speakers` holds the names the model
        recognized, to offer. Needs editing rights; counts up the note's `revision`.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, description: The speaker's label in the transcript, example: "Speaker 1" }
                to: { type: string, maxLength: 40, description: The speaker's name (no colons or brackets), example: "Anna" }
      responses:
        "200":
          description: Renamed
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400":
          description: The transcript has no such speaker, or the name isn't valid
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The note has no transcript with speakers
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/versions:
    get:
      tags: ["Recordings"]
      summary: List the earlier versions of the note's text
      description: |
        The note's title and text as they were before changes replaced them, newest first,
        without the text (`markdown`). While a person keeps editing, the text is kept at most
        once in 10 minutes; restoring a version and making a summary again always keep the
        text they replace. Empty texts aren't kept, and a note keeps its newest 50 versions.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The versions
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NoteVersion" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/versions/{versionId}:
    get:
      tags: ["Recordings"]
      summary: Get an earlier version of the note's text
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The version, with its text
          content: { application/json: { schema: { $ref: "#/components/schemas/NoteVersion" } } }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/versions/{versionId}/restore:
    post:
      tags: ["Recordings"]
      summary: Restore an earlier version of the note's text
      description: |
        Makes the version's title and text the note's again, like an edit (needs editing
        rights; notes of reMarkable documents are read-only). The text it replaces is kept as
        a version, so restoring can be undone. With `baseRevision`, text someone else changed
        meanwhile is not replaced (409 `changed`).
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseRevision: { type: integer, format: int64, description: The note's `revision` the restore was chosen on }
      responses:
        "200":
          description: Restored
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Someone else changed the text meanwhile (`changed`), or the note has no text yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/template:
    put:
      tags: ["Recordings"]
      summary: Make the note a template, or a plain note again
      description: |
        Templates are text notes the web app offers when a new note is made; their title and
        text are copied into the new note, with `{{date}}`, `{{time}}`, `{{weekday}}` and
        `{{title}}` filled in. Needs editing rights; only text notes can be templates.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: boolean }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/public:
    put:
      tags: ["Recordings"]
      summary: Publish the note on the web
      description: |
        Gives the note a public link, `/p/<token>` in the web app (the note's `public.token`),
        which shows its title and text, read-only, to anyone who has it, without signing in.
        A published note keeps its link. Only the owner publishes; boards and notes without
        text can't be published. The link stops working while the note is in the trash.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The note has no text yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: ["Recordings"]
      summary: Take the note's public link down
      description: The link stops working; publishing the note again makes a new one. Only the owner.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Not published any more
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /public/{token}:
    get:
      tags: ["Recordings"]
      summary: Read a published note
      description: |
        A note published with `PUT /recordings/{recordingId}/public`, for anyone with its link;
        the secret token in the link authenticates the request. Pictures in the text point at
        `/public/{token}/images/{imageId}`. Limited to 120 requests per minute.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The note
          content: { application/json: { schema: { $ref: "#/components/schemas/PublicNote" } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { description: Too many requests }

  /public/{token}/images/{imageId}:
    get:
      tags: ["Recordings"]
      summary: Get a picture of a published note
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The picture
          content: { image/*: { schema: { type: string, format: binary } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { description: Too many requests }

  /recordings/{recordingId}/labels:
    put:
      tags: ["Recordings", "Labels"]
      summary: Set the note's labels
      description: Replaces the note's labels with the given label IDs, in order. Taking off the `task` label also clears `done`.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels: { type: array, maxItems: 20, items: { type: string }, example: [task] }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/folder:
    put:
      tags: ["Recordings", "Folders"]
      summary: Move the note into a folder
      description: A sub-note moved into a folder is no longer under its parent note. Its own sub-notes come along.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: string, description: A folder ID from GET /folders; empty for the top level }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/parent:
    put:
      tags: ["Recordings", "Folders"]
      summary: Make the note a sub-note of another note
      description: |
        Notes can hold sub-notes, like a folder whose head is a note itself. A sub-note is in no
        folder of its own; it is listed under its parent wherever that is, and its own sub-notes
        come along. A note can't go under itself or one of its own sub-notes, and notes nest at
        most 8 deep. Deleting a note moves its sub-notes up to where it was.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId: { type: string, description: The ID of another of your notes; empty takes the note out to the top level }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/board:
    put:
      tags: ["Recordings"]
      summary: Change a board
      description: |
        Replaces a board's scope, its columns (rename, add, remove, reorder) and which notes are
        in which column. Columns without an `id` get one.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Board" }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/done:
    put:
      tags: ["Recordings", "Labels"]
      summary: Check off a task
      description: |
        Sets the check mark of a note labeled `task`. Checking off a recurring task moves it to
        its next date, unless `final` is set: then its repeat rule is removed and it is done.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
                final: { type: boolean, description: "With done, checks off a recurring task for good." }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400":
          description: The note isn't labeled as a task
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/due:
    put:
      tags: ["Recordings", "Tasks"]
      summary: Set when a task is due
      description: |
        Sets the due date, optional time, repeat rule and reminder, or clears them (`due: null`).
        A note gets the `task` label when a date is set. The reminder is sent at the given
        number of minutes before the due time (for a day without a time: before 9:00), in the
        user's time zone, unless that moment has passed.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due]
              properties:
                due: { allOf: [{ $ref: "#/components/schemas/Due" }], nullable: true }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/priority:
    put:
      tags: ["Recordings", "Tasks"]
      summary: Set a task's priority
      description: 1 is the most urgent, 3 the least; 0 clears it. A note gets the `task` label when a priority is set.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { $ref: "#/components/schemas/Priority" }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/assignee:
    put:
      tags: ["Recordings", "Tasks"]
      summary: Assign a task
      description: |
        Assigns a task (a note labeled `task`) to the note's owner or to a user it is shared
        with; an empty `assigneeId` unassigns it. Needs an editor of the note. The reporter of
        a task is the user who made the note (`GET /recordings/{id}/shares`, `reporter`). An
        assignee who loses access to the note, or is deleted, is unassigned.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { type: string, description: 'User ID; empty for none' }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/action-items/{itemId}/task:
    post:
      tags: ["Recordings", "Tasks"]
      summary: Make a task of an action item
      description: |
        Creates a text note labeled `task` under the note, titled with the action item's text
        and due on its date (with a reminder at 9:00), and remembers it as the item's `taskId`.
        The body is optional and overrides the defaults.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                markdown: { type: string, maxLength: 100000 }
                due: { $ref: "#/components/schemas/Due" }
                priority: { $ref: "#/components/schemas/Priority" }
      responses:
        "201":
          description: The new task and the note it came from
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Recording" }
                  note: { $ref: "#/components/schemas/Recording" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A task was already made of this action item
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /recordings/{recordingId}/action-items/{itemId}/dismissed:
    put:
      tags: ["Recordings", "Tasks"]
      summary: Dismiss an action item
      description: Hides an action item you don't want as a task, or shows it again.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dismissed]
              properties:
                dismissed: { type: boolean }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "404": { $ref: "#/components/responses/Error" }

  /filters:
    get:
      tags: ["Filters"]
      summary: List saved filters
      description: Your saved filters, by name.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Filters
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Filter" } }
    post:
      tags: ["Filters"]
      summary: Save a filter
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FilterInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Filter" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /filters/{filterId}:
    parameters:
      - { name: filterId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Filters"]
      summary: Change a saved filter
      description: Renames it, changes its query, or pins or unpins it.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FilterInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Filter" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Filters"]
      summary: Delete a saved filter
      description: Boards showing it show no notes until another scope is chosen.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /timer:
    get:
      tags: ["Time tracking"]
      summary: Get the running timer
      description: A focus session that has run out is stopped first, so `timer` is null then.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The running timer, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  timer: { allOf: [{ $ref: "#/components/schemas/TimeEntry" }], nullable: true }
    post:
      tags: ["Time tracking"]
      summary: Start the timer on a note
      description: Stops the timer that was running. With `minutes` it is a focus session (Pomodoro) that stops by itself after that many minutes.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteId]
              properties:
                noteId: { type: string }
                minutes: { type: integer, minimum: 0, maximum: 240, example: 25 }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  timer: { $ref: "#/components/schemas/TimeEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Time tracking"]
      summary: Stop the timer
      description: Adds the time to the note's `trackedSeconds`.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The stopped timer, or null when none was running
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { allOf: [{ $ref: "#/components/schemas/TimeEntry" }], nullable: true }

  /time-entries:
    get:
      tags: ["Time tracking"]
      summary: List the time log
      description: The entries that started on the days from `from` to `to` (inclusive, in your time zone), oldest first. Without them, the current week (Monday to Sunday).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeEntry" } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Time tracking"]
      summary: Log time by hand
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteId, start, end]
              properties:
                noteId: { type: string }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time, description: 'After start, at most 24 hours later, not in the future' }
      responses:
        "201":
          description: Logged
          content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /time-entries/export:
    get:
      tags: ["Time tracking"]
      summary: Export the time log as CSV
      description: 'Columns: date, start, end (in your time zone), minutes, note, number, estimate_minutes. Same period as `GET /time-entries`.'
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV file
          content: { text/csv: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }

  /time-entries/{entryId}:
    delete:
      tags: ["Time tracking"]
      summary: Delete a time log entry
      description: Takes its time off the note's `trackedSeconds`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /recordings/{recordingId}/estimate:
    put:
      tags: ["Recordings", "Tasks", "Time tracking"]
      summary: Set a task's estimate
      description: How many minutes the task is expected to take; 0 clears it. A note gets the `task` label when an estimate is set.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: recordingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 0, maximum: 10000, example: 45 }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/calendar:
    get:
      tags: ["Calendar"]
      summary: Get the calendar feed's state
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: State
          content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } }
    post:
      tags: ["Calendar"]
      summary: Make a calendar feed link
      description: Returns a new secret link in `feedPath`, shown only now. A previous link stops working.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The new link
          content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } }
    delete:
      tags: ["Calendar"]
      summary: Turn the calendar feed off
      description: Its link stops working.
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Turned off }

  /ask:
    post:
      tags: ["Ask"]
      summary: Ask a question about your notes
      description: |
        Answers a question from your notes and those shared with you. The summary model picks
        the notes that fit the question from a catalog of them (title, date, the start of the
        text) and names words to look for, which are looked up in the full texts and
        transcripts; it then answers from the notes found, citing them as [1], [2], … in
        `answer`. `sources` lists the cited notes with a supporting passage and, for
        recordings, where it is said. Follow-up questions send the conversation so far in
        `history`. Limited to 30 questions per minute.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000, example: "What did Anna say about the Q3 budget?" }
                history:
                  type: array
                  description: The earlier questions and answers, oldest first (the last 3 are used)
                  items:
                    type: object
                    properties:
                      question: { type: string }
                      answer: { type: string }
      responses:
        "200":
          description: The answer; empty with no sources when you have no notes
          content: { application/json: { schema: { $ref: "#/components/schemas/AskAnswer" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: The AI models are not set up
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { description: Too many questions }

  /ai/write:
    post:
      tags: ["Ask"]
      summary: Have the AI write or rewrite part of a note
      description: |
        The summary model works on a passage of a note for the editor and answers with
        Markdown; nothing is saved. `action` says what to do: `improve`, `fix` (spelling and
        grammar), `shorter`, `longer`, `simplify`, `professional`, `casual`, `summarize`,
        `tasks` (a checklist of the action items), `table`, `translate` (into `language`, a
        summary language), `continue` (writes on from `text`, the text before the cursor),
        `custom` (does `instruction` with `text`) or `write` (writes new text as
        `instruction` asks). `context` is the note around the passage, optional. Limited to
        30 requests per minute.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [improve, fix, shorter, longer, simplify, professional, casual, summarize, tasks, table, translate, continue, custom, write] }
                text: { type: string, maxLength: 20000, description: The passage as Markdown; empty for `write` }
                context: { type: string, description: The note around the passage (the first 8000 characters are used) }
                instruction: { type: string, maxLength: 1000, example: "Rewrite this as an email to the team" }
                language: { type: string, example: de-DE, description: 'For `translate`: one of GET /ai/languages' }
      responses:
        "200":
          description: The text written
          content:
            application/json:
              schema:
                type: object
                properties:
                  markdown: { type: string }
                  model: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: The AI models are not set up
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { description: Too many requests }

  /me/briefing:
    get:
      tags: ["Briefings"]
      summary: Get your briefing settings
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { $ref: "#/components/schemas/BriefingSettings" } } }
    put:
      tags: ["Briefings"]
      summary: Change your briefing settings
      description: |
        Turns the daily briefing and the weekly review on or off, and sets when they are made
        (in your time zone). Turned on after today's time, the first one is made the next day.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BriefingSettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/BriefingSettings" } } }
        "400": { $ref: "#/components/responses/Error" }

  /me/briefing/today:
    get:
      tags: ["Briefings"]
      summary: Get today's daily briefing
      description: |
        Returns your daily briefing for today, making it right away when there is none yet
        (without a notification; the one made at the briefings' time replaces it). It lists
        the tasks due today and, as set in `sections`, the tasks overdue and coming up this
        week, the notes that came in since the day before (with a digest by the summary model,
        when it is set up) and the open action items of the last `actionItemDays` days. With
        the daily briefing turned off, only `off` is set. It is written in the language chosen
        in the settings (else in `lang`); one kept in another language is made again.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: lang
          in: query
          description: The language the app shows ("en", "de"); the briefing is written in it when no language is chosen in the settings.
          schema: { type: string, enum: [en, de] }
      responses:
        "200":
          description: The briefing
          content: { application/json: { schema: { $ref: "#/components/schemas/DailyBriefing" } } }
    post:
      tags: ["Briefings"]
      summary: Make today's daily briefing again
      description: Makes your daily briefing for today again, with what is new since.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: lang
          in: query
          description: The language the app shows ("en", "de"); the briefing is written in it when no language is chosen in the settings.
          schema: { type: string, enum: [en, de] }
      responses:
        "200":
          description: The briefing
          content: { application/json: { schema: { $ref: "#/components/schemas/DailyBriefing" } } }
        "429": { description: Too many requests }

  /me/briefing/run:
    post:
      tags: ["Briefings"]
      summary: Make a weekly review now
      description: |
        Makes a weekly review right away, whether or not it is turned on, and sends its
        notification. It is a text note (`source: briefing`) in your folder "Briefings", which
        is made when missing. It covers the seven days before (and today so far): new notes
        (with a digest), tasks checked off, time logged, and the tasks overdue, coming up and
        waiting for over 30 days. The daily briefing is no note; see `/me/briefing/today`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: lang
          in: query
          description: The language the app shows ("en", "de"); the briefing is written in it when no language is chosen in the settings.
          schema: { type: string, enum: [en, de] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [weekly] }
      responses:
        "201":
          description: The briefing's note
          content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { description: Too many requests }

  /me/mcp:
    get:
      tags: ["MCP server"]
      summary: Get your MCP access's state
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: State
          content: { application/json: { schema: { $ref: "#/components/schemas/MCPSettings" } } }
    post:
      tags: ["MCP server"]
      summary: Make an MCP access token
      description: Turns the MCP server on for you and returns a new access token in `token`, shown only now. A previous token stops working.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The new token
          content: { application/json: { schema: { $ref: "#/components/schemas/MCPSettings" } } }
    delete:
      tags: ["MCP server"]
      summary: Turn your MCP access off
      description: Its token stops working.
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Turned off }

  /me/mcp/apps:
    get:
      tags: ["MCP server"]
      summary: List the AI assistants connected through OAuth
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Connected assistants, newest first
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MCPApp" } } } }

  /me/mcp/apps/{id}:
    delete:
      tags: ["MCP server"]
      summary: Disconnect an AI assistant
      description: Its tokens stop working.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Disconnected }
        "404": { $ref: "#/components/responses/Error" }

  /oauth/authorize:
    get:
      tags: ["MCP server"]
      summary: Check an OAuth authorization request
      description: |
        Used by the web app's consent page at `/oauth/authorize`, which AI assistants open
        with the parameters of an OAuth authorization request. Answers who asks, or in
        `redirectTo` where to send the browser back to when the request can't be granted. An
        unknown client or redirect URI is an error (code `invalid_client` or
        `invalid_redirect_uri`).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        "200":
          description: The request
          content: { application/json: { schema: { $ref: "#/components/schemas/OAuthAuthorization" } } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: ["MCP server"]
      summary: Allow or decline an OAuth authorization request
      description: Answers the address the browser goes back to the assistant with, holding an authorization code or the refusal.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The authorization request's parameters (as in the GET), and the decision.
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
                response_type: { type: string }
                code_challenge: { type: string }
                code_challenge_method: { type: string }
                scope: { type: string }
                state: { type: string }
                resource: { type: string }
                approve: { type: boolean }
      responses:
        "200":
          description: Where the browser goes
          content: { application/json: { schema: { type: object, properties: { redirectTo: { type: string } } } } }
        "400": { $ref: "#/components/responses/Error" }

  /calendar/{token}.ics:
    get:
      tags: ["Calendar"]
      summary: Calendar feed
      description: |
        The open tasks with dates (not in the trash) as iCalendar events, for calendar apps to
        subscribe to. Tasks without a time are all-day events; timed ones last their estimate
        (30 minutes without one). Repeating tasks repeat, and reminders become alarms. The
        secret token in the link authenticates the request.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: iCalendar
          content: { text/calendar: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { description: Too many requests }

  /me/notifications:
    get:
      tags: ["Notifications"]
      summary: Your notification setup
      description: Whether the server can send notifications, the VAPID public key browsers subscribe with (`applicationServerKey`), and the browsers that receive yours.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Setup
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationStatus" } } }

  /me/notifications/subscriptions:
    post:
      tags: ["Notifications"]
      summary: Receive notifications in this browser
      description: Takes the browser's `PushSubscription.toJSON()`. The endpoint must belong to a browser push service (Google, Mozilla, Apple, Microsoft). Subscribing the same browser again replaces its subscription.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        "201":
          description: Subscribed
          content: { application/json: { schema: { $ref: "#/components/schemas/PushDevice" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Notifications are not available on this server
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/notifications/subscriptions/{id}:
    delete:
      tags: ["Notifications"]
      summary: Stop notifications to a browser
      description: The ID is a device's `id` from GET /me/notifications, i.e. the first 16 bytes of the SHA-256 of its endpoint, in hex.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Stopped }

  /me/notifications/test:
    post:
      tags: ["Notifications"]
      summary: Send a test notification
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: How many browsers took it
          content: { application/json: { schema: { type: object, properties: { sent: { type: integer } } } } }
        "409":
          description: Notifications are not available on this server
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/notifications/stream:
    get:
      tags: ["Notifications"]
      summary: Receive notifications over a live connection
      description: |
        Server-sent events: a `notification` event (data `{title, body, url, tag}`, like a
        Web Push message) for each of your notifications while the connection is open, and a
        comment every 25 seconds. For apps that can't use Web Push, such as the desktop app.
        A user can have 10 such connections; opening another ends one of the others.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The event stream
          content: { text/event-stream: { schema: { type: string } } }
        "403": { $ref: "#/components/responses/Error" }

  /me/backup:
    get:
      tags: ["Backup"]
      summary: Download a backup of your notes and content
      description: |
        Streams a zip file with everything you own: your notes (also the ones in the trash)
        with their audio, documents, images and attachments, your folders, labels, themes,
        saved filters and finished time entries. It leaves out your account (password,
        tokens, connections), your devices, who your notes and folders are shared with, notes
        shared with you by others, notes that are still being uploaded, and a running timer.
        Send it back to `/me/restore` to get the content back. Limited to 6 per hour per IP.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: The backup
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="knowpod-notes-<time>.zip"' }
          content:
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: A restore of your content is running (code `backup_busy`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/restore:
    post:
      tags: ["Backup"]
      summary: Restore your notes and content from a backup
      description: |
        **Replaces all your notes and content.** Your notes (with their files), folders,
        labels, themes, saved filters and time entries are deleted and the ones in the backup
        are put in their place; notes and folders you had shared are no longer shared. Your
        account, devices and everything of other users stay as they are. A backup of a
        different account of this installation is restored as yours, unless it holds notes
        that belong to somebody else now. The backup is checked completely before anything
        changes; if the restore is interrupted afterwards, send the same backup again. Send
        the zip file as the request body. Limited to 6 per hour per IP.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must be `replace-my-data`.
          schema: { type: string, enum: [replace-my-data] }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt: { type: string, format: date-time, description: When the backup was made }
                  collections: { type: object, additionalProperties: { type: integer }, description: Documents restored per collection }
                  objects: { type: integer, description: Files restored to the object store }
                  objectBytes: { type: integer, format: int64 }
        "400":
          description: The confirmation is missing (code `confirmation_required`), or the file isn't a complete personal knowpod backup that fits your account (code `invalid_input`); nothing was changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Another backup or restore of your content is running (code `backup_busy`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /me/events:
    get:
      tags: ["Sharing"]
      summary: Receive note changes over a live connection
      description: |
        Server-sent events about the notes you see (yours and those shared with you), made by
        anyone, in any app, or by the processing: `note` (data `{type, id, version}`: load the
        note again unless you have this version; it is gone for you when that fails) and
        `reload` (data `{type}`: many notes changed; load the list again). A comment is sent
        every 25 seconds. A user can have 10 such connections; opening another ends one of the
        others.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The event stream
          content: { text/event-stream: { schema: { type: string } } }
        "403": { $ref: "#/components/responses/Error" }

  /me/people:
    get:
      tags: ["Sharing"]
      summary: List the people you share with
      description: |
        You and the users you share with: the owners, makers and assignees of the notes you
        see, everyone those notes and your folders are shared with, and the owners of folders
        shared with you. You come first, then by email. The web app uses it to show whose a
        note is and to resolve names in filters such as `owner:bob` or `from:me`.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The people
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId: { type: string }
                    email: { type: string }
                    self: { type: boolean, description: Your own entry }
        "401": { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      tags: ["Admin: users"]
      summary: List users
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Admin: users"]
      summary: Create a user
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8, maxLength: 72 }
                role: { type: string, enum: [user, admin], default: user }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: Email already in use
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      tags: ["Admin: users"]
      summary: Change a user's email or role
      description: The built-in admin (ADMIN_EMAIL) keeps its email and role; the last admin can't be demoted.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [user, admin] }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: ["Admin: users"]
      summary: Delete a user and their data
      description: |
        Removes the user with their devices, recordings (including the audio in storage)
        and sessions. You can't delete yourself, the built-in admin or the last admin.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/users/{userId}/password:
    put:
      tags: ["Admin: users"]
      summary: Set a user's password
      description: The user is signed out everywhere. For the built-in admin this replaces ADMIN_PASSWORD.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8, maxLength: 72 }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/settings/openrouter:
    get:
      tags: ["Admin: AI settings"]
      summary: OpenRouter settings
      description: The API key is never returned; `apiKeyHint` shows its last characters.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: Settings
          content: { application/json: { schema: { $ref: "#/components/schemas/OpenRouterSettings" } } }
    put:
      tags: ["Admin: AI settings"]
      summary: Change OpenRouter settings
      description: Fields left out stay unchanged; an empty `apiKey` removes the key.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { type: string, example: sk-or-v1-… }
                transcriptionProvider: { type: string, enum: [openrouter, elevenlabs], description: Transcribes audio. Documents are always read through OpenRouter. }
                elevenLabsApiKey: { type: string, description: Used when ElevenLabs transcribes; empty removes the key }
                transcriptionModel: { type: string, example: google/gemini-2.5-flash, description: The OpenRouter model that transcribes }
                summaryModel: { type: string, example: google/gemini-2.5-flash }
                documentModel: { type: string, example: google/gemini-2.5-flash, description: Empty uses the transcription model }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/OpenRouterSettings" } } }
        "400": { $ref: "#/components/responses/Error" }

  /admin/settings/elevenlabs/test:
    post:
      tags: ["Admin: AI settings"]
      summary: Test an ElevenLabs API key
      description: |
        Transcribes a second of silence to check that the key may use speech-to-text. Tests
        the `apiKey` given, or the stored key when it is left out.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey: { type: string }
      responses:
        "200":
          description: The key works
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
        "400": { description: "No key, or ElevenLabs rejected it (`elevenlabs_unauthorized`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: "ElevenLabs answered with another error (`elevenlabs_failed`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/backup:
    get:
      tags: ["Admin: backup"]
      summary: Download a full backup
      description: |
        Streams a zip file with all users, notes, settings and every file in the object
        store. Use it from scripts with the admin token:
        `curl -H "Authorization: Bearer $ADMIN_TOKEN" -OJ https://your-host/api/v1/admin/backup`.
        Large installations take a while; the response is streamed. Limited to 6 per hour per IP.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      responses:
        "200":
          description: The backup
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="knowpod-backup-<time>.zip"' }
          content:
            application/zip: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: A restore is running (code `backup_busy`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /admin/restore:
    post:
      tags: ["Admin: backup"]
      summary: Restore everything from a backup
      description: |
        **Replaces all data.** Every collection except the sessions is emptied and filled from
        the backup, and the backup's files are written to the object store (files that aren't in
        the backup stay, unreferenced). The backup is checked completely before anything
        changes. If the restore is interrupted afterwards, send the same backup again. Users
        who aren't in the backup lose their access. Send the zip file as the request body:
        `curl -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/zip" --data-binary @backup.zip "https://your-host/api/v1/admin/restore?confirm=replace-all-data"`.
        Limited to 6 per hour per IP.
      security: [{ sessionCookie: [] }, { adminToken: [] }]
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must be `replace-all-data`.
          schema: { type: string, enum: [replace-all-data] }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdAt: { type: string, format: date-time, description: When the backup was made }
                  collections: { type: object, additionalProperties: { type: integer }, description: Documents restored per collection }
                  objects: { type: integer, description: Files restored to the object store }
                  objectBytes: { type: integer, format: int64 }
        "400":
          description: The confirmation is missing (code `confirmation_required`), or the file isn't a complete knowpod backup (code `invalid_input`); nothing was changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Another backup or restore is running (code `backup_busy`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Device token returned by POST /admin/devices
    sessionCookie:
      type: apiKey
      in: cookie
      name: knowpod_session
      description: Web UI session, set by POST /auth/login
    adminToken:
      type: http
      scheme: bearer
      description: The ADMIN_TOKEN environment variable (for scripts)

  headers:
    UploadOffset:
      description: Bytes received so far
      schema: { type: integer, format: int64 }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    ShareRole:
      type: string
      enum: [viewer, editor]

    Sharing:
      type: object
      properties:
        owner: { $ref: "#/components/schemas/ShareUser" }
        members: { type: array, items: { $ref: "#/components/schemas/ShareUser" } }
        template: { type: boolean, description: The text note is a template, offered when a new note is made; absent otherwise }
        public:
          type: object
          description: The note's public web link; absent when it isn't published
          properties:
            token: { type: string, description: 'The secret part of the link: /p/<token> in the web app, GET /public/<token> in the API' }
            createdAt: { type: string, format: date-time }
        access: { type: string, enum: [owner, editor, viewer], description: What you may do with the note }
        reporter: { $ref: "#/components/schemas/ShareUser" }

    ShareUser:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }
        inherited: { type: boolean, description: Shared through a note this one is under; the sharing is changed there }

    Status:
      type: string
      enum: [remote, uploading, received, stored, transcribed, summarized, failed]

    CreateUpload:
      type: object
      required: [recordingId, size, sha256]
      properties:
        recordingId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
          description: ID assigned by the device; unique per device
        size: { type: integer, format: int64, minimum: 44, description: Total WAV size in bytes }
        sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: Hex SHA-256 of the WAV file }
        recordedAt: { type: string, format: date-time }
        highlights:
          type: array
          maxItems: 1000
          description: Moments marked while recording. A repeated create with highlights replaces them.
          items: { $ref: "#/components/schemas/HighlightInput" }

    HighlightInput:
      type: object
      description: Give exactly one of `offsetMs` (from the start of the recording) or `at` (wall-clock time; needs the upload's `recordedAt`).
      properties:
        offsetMs: { type: integer, format: int64, minimum: 0, example: 184000 }
        at: { type: string, format: date-time }

    Highlight:
      type: object
      properties:
        offsetMs: { type: integer, format: int64, description: Milliseconds from the start of the recording }
        at: { type: string, format: date-time, description: Wall-clock time, if the device sent one }

    Upload:
      type: object
      properties:
        uploadId: { type: string }
        recordingId: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        size: { type: integer, format: int64 }
        offset: { type: integer, format: int64 }
        error: { type: string, description: Reason when status is failed }

    Device:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }

    Board:
      type: object
      description: The setup of a board note.
      properties:
        scope:
          type: object
          description: The notes the board shows. An empty kind shows none.
          properties:
            kind: { type: string, enum: ["", folder, label, filter] }
            id: { type: string, description: 'A folder ID (empty for the top level), a label ID or a saved filter ID' }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              id: { type: string, maxLength: 40 }
              name: { type: string, maxLength: 60 }
              notes: { type: array, items: { type: string }, description: IDs of the notes in the column, in order }
    Due:
      type: object
      description: When a task is due, in the owner's time zone.
      required: [date]
      properties:
        date: { type: string, format: date, example: "2026-09-28" }
        time: { type: string, pattern: '^\d{2}:\d{2}$', example: "15:30", description: Absent for the whole day }
        remind: { type: integer, minimum: 0, maximum: 40320, description: 'Minutes before the due time (a day without a time: before 9:00) to send a reminder; absent sends none' }
        repeat:
          type: object
          description: Makes the task recurring; checking it off moves it to the next date.
          required: [every, unit]
          properties:
            every: { type: integer, minimum: 1, maximum: 365 }
            unit: { type: string, enum: [day, weekday, week, month, year], description: '"weekday" is Monday to Friday (every must be 1)' }
            weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'Weekly: the days (0 = Sunday). Monthly with nth: the one weekday' }
            monthDay: { type: integer, minimum: 1, maximum: 31, description: 'Monthly: the day of the month (defaults to the date''s); months without it use their last day' }
            nth: { type: integer, enum: [1, 2, 3, 4, -1], description: 'Monthly: repeat on the nth of the weekday in weekdays instead of a day of the month (-1 = the last), e.g. every third Friday: nth 3, weekdays [5]' }

    Priority:
      type: integer
      minimum: 0
      maximum: 3
      description: 1 is the most urgent, 3 the least; 0 or absent is none.

    ActionItem:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        owner: { type: string, description: Who should do it, if named }
        due: { type: string, format: date, description: The date named in the conversation }
        taskId: { type: string, description: The task made from it }
        dismissed: { type: boolean }

    NotificationStatus:
      type: object
      properties:
        available: { type: boolean, description: Whether the server can send notifications }
        publicKey: { type: string, description: VAPID public key (base64url) for PushManager.subscribe }
        devices: { type: array, items: { $ref: "#/components/schemas/PushDevice" } }
        listening: { type: integer, description: How many apps receive your notifications over a live connection (GET /me/notifications/stream) right now }

    PushDevice:
      type: object
      properties:
        id: { type: string }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }

    Recording:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string, description: The user the recording belongs to }
        number: { type: integer, format: int64, description: 'The note''s number among its owner''s notes (1, 2, 3, …), never reused; "#12" in a note''s text links to note 12' }
        deviceId: { type: string, description: '"pocket:<userId>" for Pocket, "upload:<userId>" for browser uploads, "text:<userId>" for text notes, "board:<userId>" for boards, "remarkable:<userId>" for reMarkable documents' }
        type: { type: string, enum: [text, document, board], description: 'The kind of note: absent for audio recordings, "text" for Markdown notes (title and text in `summary`), "document" for reMarkable documents and uploaded photos and PDFs (the text read from the pages in `transcript`), "board" for kanban boards (title in `summary`, setup in `board`)' }
        source: { type: string, enum: [pocket, upload, recorder, remarkable, briefing], description: 'Absent for device uploads; "upload" for files uploaded in the browser, "recorder" for voice memos recorded there, "briefing" for daily briefings and weekly reviews' }
        title: { type: string, description: Title from the source (Pocket, the document's name on the reMarkable) }
        recordingId: { type: string, description: Device-assigned ID, the Pocket recording ID, or the reMarkable document ID }
        status: { $ref: "#/components/schemas/Status" }
        deletedAt: { type: string, format: date-time, description: When the note was moved to the trash; absent when it isn't in the trash. Notes are deleted for good 14 days later. }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        sourceContentType: { type: string, description: Media type of audio fetched from Pocket }
        recordedAt: { type: string, format: date-time }
        format:
          type: object
          properties:
            sampleRate: { type: integer }
            channels: { type: integer }
            bitsPerSample: { type: integer }
            frames: { type: integer, format: int64 }
            durationMs: { type: integer, format: int64 }
        audio: { $ref: "#/components/schemas/Object" }
        original: { $ref: "#/components/schemas/Object" }
        file: { $ref: "#/components/schemas/Object" }
        pages: { type: integer, description: Number of pages of a document }
        attachments:
          type: array
          description: Files attached to the note
          items:
            type: object
            required: [id, name, contentType, size]
            properties:
              id: { type: string }
              name: { type: string }
              contentType: { type: string }
              size: { type: integer, format: int64 }
        summaryOptions: { $ref: "#/components/schemas/SummaryOptions" }
        highlights: { type: array, items: { $ref: "#/components/schemas/Highlight" } }
        labels: { type: array, items: { type: string }, description: IDs of the note's labels (see GET /labels) }
        done: { type: boolean, description: Check mark of a note labeled `task` }
        doneAt: { type: string, format: date-time, description: When the task was last checked off }
        due: { $ref: "#/components/schemas/Due" }
        priority: { $ref: "#/components/schemas/Priority" }
        assigneeId: { type: string, description: 'The user a task is assigned to (the owner or a user the note is shared with); absent when unassigned' }
        remindAt: { type: string, format: date-time, description: When the task's next reminder is sent; absent when none is pending }
        estimate: { type: integer, description: How many minutes the task is expected to take; absent for none }
        trackedSeconds: { type: integer, format: int64, description: Time logged on the note with the timer or by hand (finished entries) }
        folderId: { type: string, description: The folder the note is in (see GET /folders); absent at the top level and for sub-notes }
        parentId: { type: string, description: The note this one is a sub-note of; absent otherwise }
        position: { type: integer, description: Order among the notes in the same place, from 1 up; absent for unordered notes, which follow by title }
        board: { $ref: "#/components/schemas/Board" }
        tablet:
          type: object
          description: A text note's copy on the owner's reMarkable (an EPUB of its title and text), sent while the note is in the reMarkable folder or a folder inside it. Absent for notes never sent.
          properties:
            documentId: { type: string, description: The document in the reMarkable cloud }
            removed: { type: boolean, description: 'The copy is in the tablet''s trash, because the note left the reMarkable folder or went into the trash' }
            sentAt: { type: string, format: date-time, description: When the copy was last written }
            error: { type: string, description: Why the last send failed; it is tried again }
        access: { type: string, enum: [owner, editor, viewer], description: What you may do with the note }
        shared: { type: boolean, description: The note is shared with anyone; absent otherwise }
        createdBy: { type: string, description: 'The user who made the note, when it isn''t its owner (an editor of the note it is under)' }
        version: { type: integer, format: int64, description: Counted up by every change of the note }
        revision: { type: integer, format: int64, description: Counted up by every change of the title and text; send it as `baseRevision` when editing them }
        transcript:
          type: object
          properties:
            text: { type: string }
            model: { type: string }
            createdAt: { type: string, format: date-time }
        summary:
          type: object
          properties:
            title: { type: string }
            markdown: { type: string, description: Left out in lists }
            model: { type: string }
            language: { type: string }
            themeId: { type: string }
            themeName: { type: string }
            editedAt: { type: string, format: date-time, description: Set when a person edited the summary }
            actionItems: { type: array, items: { $ref: "#/components/schemas/ActionItem" }, description: 'Follow-ups found in the conversation; left out in lists' }
            speakers:
              type: array
              description: The names the model recognized for the transcript's speaker labels, offered for naming the speakers
              items:
                type: object
                properties:
                  label: { type: string, example: Speaker 1 }
                  name: { type: string, example: Anna }
            createdAt: { type: string, format: date-time }
        attempts: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        storedAt: { type: string, format: date-time }

    Account:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        language: { type: string, description: Web UI language (en, de); absent follows the browser }
        timeZone: { type: string, description: IANA time zone of task dates and reminders; absent is UTC }
        appearance: { type: string, enum: [light, dark], description: Web UI color scheme; absent follows the system }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        builtIn: { type: boolean, description: The ADMIN_EMAIL account }
        usesEnvPassword: { type: boolean, description: Built-in admin still signing in with ADMIN_PASSWORD }
        pocketConfigured: { type: boolean }
        createdAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time }

    PocketSettings:
      type: object
      properties:
        webhookPath: { type: string, example: /api/v1/webhooks/pocket/3f9a… }
        webhookSecretConfigured: { type: boolean }
        apiKeyConfigured: { type: boolean }
        apiKeyHint: { type: string, example: …a1b2 }

    RemarkableSettings:
      type: object
      properties:
        paired: { type: boolean }
        pairedAt: { type: string, format: date-time }
        folder: { type: string, example: reMarkable, description: The name of the knowpod folder imported documents go into }
        connectUrl: { type: string, example: https://my.remarkable.com/device/browser/connect, description: Where to get a one-time code }
        lastPullAt: { type: string, format: date-time }
        lastError: { type: string, description: Why the last pull failed }
        ignoredNames: { type: array, items: { type: string }, description: Names of documents that aren't imported }
        lastResult:
          type: object
          properties:
            documents: { type: integer, description: Documents in the account (not in the trash, not ignored) }
            imported: { type: integer, description: New notes }
            updated: { type: integer, description: Notes queued again because their document changed }
            ignored: { type: integer, description: Documents left out because of their name }

    SummaryOptions:
      type: object
      properties:
        language: { type: string, example: de-DE, description: '"auto" (default) or a tag from GET /ai/languages' }
        model: { type: string, example: google/gemini-2.5-flash, description: Empty uses the configured summary model }
        themeId: { type: string, example: meeting, description: Empty or "auto" uses the Auto theme }

    Theme:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string }
        builtIn: { type: boolean }
        customized: { type: boolean, description: A built-in theme you changed }

    Label:
      type: object
      properties:
        id: { type: string, example: task }
        name: { type: string, description: Built-in labels are named by the UI in its language }
        color: { type: string, example: "#3b5f86" }
        builtIn: { type: boolean }

    LabelInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string, maxLength: 40, description: Unique among your labels, ignoring case }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$", example: "#2f6f5e" }

    Filter:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        query:
          type: string
          example: "label:Task & due:week & !done"
          description: |
            The notes it selects. Terms: words (in the title), `label:Name` or `@Name`,
            `folder:Name`, `due:today|tomorrow|overdue|week|month|none|any|2026-10-01`,
            `due<2026-10-01` (also `<=`, `>`, `>=`), `done`, `task`, `p1`-`p3`, `repeat`,
            `estimate`, `type:text|audio|document|board`, `#12`. Combine them with `&` (or a
            space), `|` and `!`, and group them with parentheses; quote names with spaces.
        pinned: { type: boolean, description: Shown in the notes list }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FilterInput:
      type: object
      required: [name, query]
      properties:
        name: { type: string, maxLength: 60, description: Unique among your filters, ignoring case }
        query: { type: string, maxLength: 500 }
        pinned: { type: boolean }

    TimeEntry:
      type: object
      description: Time spent on a note. A running timer has no `end`.
      properties:
        id: { type: string }
        noteId: { type: string }
        noteTitle: { type: string }
        noteNumber: { type: integer, format: int64 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        until: { type: string, format: date-time, description: When a focus session ends by itself }
        seconds: { type: integer, format: int64, description: How long it lasted; a running timer up to now }
        createdAt: { type: string, format: date-time }

    NoteVersion:
      type: object
      description: A note's title and text as they were before a change replaced them.
      properties:
        id: { type: string }
        noteId: { type: string }
        revision: { type: integer, format: int64, description: The note's `revision` the text had }
        title: { type: string }
        markdown: { type: string, description: The text; left out of lists }
        savedAt: { type: string, format: date-time, description: When this text was saved }
        createdAt: { type: string, format: date-time, description: When a change replaced it }
        reason: { type: string, enum: [edit, restore, regenerate], description: What replaced it }
    PublicNote:
      type: object
      description: A published note as anyone with its link sees it.
      properties:
        title: { type: string }
        markdown: { type: string }
        type: { type: string, enum: [text, document] , description: Absent for recordings }
        date: { type: string, format: date-time, description: When the note was recorded or made }
        updatedAt: { type: string, format: date-time, description: When its text last changed }
    AskAnswer:
      type: object
      properties:
        answer: { type: string, description: 'Markdown citing the sources as [1], [2], …' }
        model: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              ref: { type: integer, description: The number the answer cites the note with }
              id: { type: string }
              number: { type: integer, format: int64, description: The note's number among its owner's notes }
              title: { type: string }
              type: { type: string, enum: [audio, text, document] }
              date: { type: string, format: date-time, description: When the note was recorded or made }
              quote: { type: string, description: A short passage of the note the answer draws on }
              offsetMs: { type: integer, format: int64, description: Where the quote is said in a recording }

    BriefingSettings:
      type: object
      properties:
        daily: { type: boolean, description: Make a briefing every day (on until turned off) }
        weekly: { type: boolean, description: Make a weekly review }
        time: { type: string, example: "07:00", description: When they are made (HH:MM in your time zone) }
        weeklyDay: { type: integer, minimum: 0, maximum: 6, description: 'The day of the weekly review (0 is Sunday); Monday (1) until one is chosen' }
        notify: { type: boolean, description: Announce the daily briefing with a notification }
        sections:
          type: array
          items: { type: string, enum: [overdue, upcoming, new, digest, actionItems] }
          description: 'The daily briefing''s parts besides the tasks due today: tasks overdue, tasks due in the next week, the new notes, the digest of them, open action items. Default: all but upcoming. Left out, they stay as they are.'
        actionItemDays: { type: integer, minimum: 1, maximum: 30, description: 'How many days back the daily briefing looks for open action items (default 7); 0 or left out keeps it as it is' }

    DailyBriefing:
      type: object
      properties:
        off: { type: boolean, description: The daily briefing is turned off; nothing else is set }
        day: { type: string, format: date, description: The day it is for, in your time zone }
        title: { type: string, example: "Briefing for Mon, Sep 28" }
        markdown: { type: string, description: 'Its text; "#12" names note 12' }
        summary: { type: string, example: "2 due today · 3 new notes" }
        language: { type: string, enum: [en, de], description: The language it is written in }
        madeAt: { type: string, format: date-time }

    CalendarSettings:
      type: object
      properties:
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: When the current link was made }
        feedPath: { type: string, example: /api/v1/calendar/kpc_abc.ics, description: 'Only right after the link was made: the path of the feed on this server' }

    MCPSettings:
      type: object
      properties:
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: When the current token was made }
        token: { type: string, example: kpm_abc, description: 'Only right after the token was made: the bearer token for the MCP server' }

    MCPApp:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Claude, description: The name the assistant registered with }
        createdAt: { type: string, format: date-time, description: When it was allowed }
        lastUsedAt: { type: string, format: date-time }

    OAuthAuthorization:
      type: object
      properties:
        clientName: { type: string, example: Claude }
        redirectUri: { type: string }
        redirectTo: { type: string, description: 'Set instead when the request fails: send the browser here' }

    Folder:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, description: The folder this one is in; absent at the top level }
        position: { type: integer, description: Order among the folders in the same place, from 1 up; absent for unordered folders, which follow by name }
        access: { type: string, enum: [owner, editor, viewer], description: What you may do in the folder }
        shared: { type: boolean, description: The folder (or one it is in) is shared }
        remarkable: { type: boolean, description: 'The folder of your paired reMarkable''s documents; it can''t be deleted while the reMarkable is paired' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80, description: Unique among the folders in the same place, ignoring case }
        parentId: { type: string, description: The folder to put it in; empty for the top level }

    ThemeInput:
      type: object
      required: [name, instructions]
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 120 }
        instructions: { type: string, maxLength: 4000, description: How to structure the summary (Markdown sections etc.) }

    OpenRouterSettings:
      type: object
      properties:
        apiKeyConfigured: { type: boolean }
        apiKeyHint: { type: string, example: …a1b2 }
        transcriptionProvider: { type: string, enum: [openrouter, elevenlabs] }
        elevenLabsApiKeyConfigured: { type: boolean }
        elevenLabsApiKeyHint: { type: string, example: …c3d4 }
        transcriptionModel: { type: string }
        summaryModel: { type: string }
        documentModel: { type: string, description: Reads document pages; empty uses the transcription model }
        updatedAt: { type: string, format: date-time }

    ModelOption:
      type: object
      properties:
        id: { type: string, example: google/gemini-2.5-flash }
        name: { type: string }
        contextLength: { type: integer }
        promptPrice: { type: string, description: USD per input token }
        completionPrice: { type: string, description: USD per output token }
        audioPrice: { type: string }

    Object:
      type: object
      properties:
        key: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }

    Error:
      type: object
      properties:
        error: { type: string, description: English message }
        code: { type: string, example: not_found, description: Stable code for clients to translate }
        offset: { type: integer, format: int64, description: Set on offset mismatches }
