<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>knowpod</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1f5;
        --card: #ffffff;
        --text: #1e2a3a;
        --muted: #5b6b80;
        --border: #cfd7e2;
        --accent: #1e2a3a;
        --accent-text: #ffffff;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121820;
          --card: #1c2430;
          --text: #e6ebf2;
          --muted: #9aa8ba;
          --border: #334052;
          --accent: #8fb0d4;
          --accent-text: #121820;
          --error: #f2b8b5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
      }
      .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .logo img { width: 40px; height: 40px; border-radius: 10px; }
      h1 { font-size: 20px; margin: 0; }
      p { color: var(--muted); margin: 0 0 16px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
      }
      button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
      .error { color: var(--error); margin: 12px 0 0; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">
        <img src="../build/icon.png" alt="" />
        <h1>knowpod</h1>
      </div>
      <p>Enter the address of your knowpod server, the same one you open in the browser.</p>
      <form id="form">
        <label for="url">Server address</label>
        <input id="url" type="text" inputmode="url" placeholder="https://knowpod.example.com" autocomplete="url" spellcheck="false" autofocus required />
        <p id="error" class="error" hidden></p>
        <div class="row">
          <button id="cancel" type="button" class="secondary" hidden>Cancel</button>
          <button type="submit">Connect</button>
        </div>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
