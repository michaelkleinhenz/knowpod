; PlatformIO Project Configuration File
;
; Two environments: one per supported board. PlatformIO builds the default
; environment (first listed) unless you pick one with -e or from the IDE.
;
; https://docs.platformio.org/page/projectconf.html

[env]
; pioarduino = Arduino-ESP32 core 3.x (the official platform is stuck on 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM: 8 MB octal (both boards)
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over the native USB-C port

monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; readable crash backtraces
upload_speed = 921600

lib_deps =
    lewisxhe/SensorLib@^0.3.1
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit GFX Library@^1.12.1
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    h2zero/NimBLE-Arduino@^2.3.0          ; Bluetooth transfer to the knowpod app

; ── Waveshare ESP32-S3-ePaper-3.97 ──────────────────────────────────────

[env:esp32-s3-epaper-397]
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    ${env.build_flags}
    -DBOARD_EPAPER_397

lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib@^0.3.0

; ── Waveshare ESP32-S3-ePaper-1.54G ─────────────────────────────────────

[env:esp32-s3-epaper-154g]
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

build_flags =
    ${env.build_flags}
    -DBOARD_EPAPER_154G
