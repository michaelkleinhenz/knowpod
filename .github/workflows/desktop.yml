# Builds the desktop app (desktop/) on each OS it ships for, the Android and iOS apps
# (mobile/), and the ESP32 firmware (esp32/) for each supported board. Keeps all
# installers, the APK, the IPA and firmware binaries as workflow artifacts. Runs by hand
# (Actions → Build and release → Run workflow) and for tags desktop-v*. The desktop builds
# and the IPA are unsigned; the APK is signed with the keystore in the repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (see README.md#android-app), else with a throwaway debug key.
# The version comes from the VERSION file; a tag desktop-v<VERSION> also publishes
# everything as a GitHub release.
name: Build and release

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Server the app connects to on its first start (optional)
        required: false
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "desktop-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version); tag desktop-v$version instead."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Same as `make desktop-<platform> SERVER_URL=…` (make isn't on every runner).
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          SERVER_URL: ${{ inputs.server_url }}
          VERSION: ${{ needs.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --${{ matrix.platform }} --publish never -c.extraMetadata.version="$VERSION" ${SERVER_URL:+-c.extraMetadata.defaultServerUrl="$SERVER_URL"}
      - uses: actions/upload-artifact@v4
        with:
          name: knowpod-desktop-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Same as `make android SERVER_URL=…`, plus the unit tests (`make android-test`).
      - name: Build
        working-directory: mobile
        shell: bash
        env:
          SERVER_URL: ${{ inputs.server_url }}
          VERSION: ${{ needs.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KNOWPOD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KNOWPOD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KNOWPOD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci
          npx cap sync android
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/knowpod.jks"
            export KNOWPOD_KEYSTORE="$RUNNER_TEMP/knowpod.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key, so it can't update an installed one."
          fi
          cd android
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersion="$VERSION" ${SERVER_URL:+-PdefaultServerUrl="$SERVER_URL"}
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/knowpod-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: knowpod-android-${{ needs.version.outputs.version }}
          path: mobile/dist/*.apk
          if-no-files-found: error

  ios:
    needs: version
    # Capacitor 8 needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Same as `make ios SERVER_URL=…`: an unsigned build for devices, packed as an IPA.
      - name: Build
        working-directory: mobile
        shell: bash
        env:
          SERVER_URL: ${{ inputs.server_url }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci
          npx cap sync ios
          code="$(echo "$VERSION" | awk -F'[.-]' '{ print $1 * 10000 + $2 * 100 + $3 }')"
          xcodebuild -version
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination generic/platform=iOS \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$code" ${SERVER_URL:+KNOWPOD_DEFAULT_SERVER_URL="$SERVER_URL"} build
          mkdir -p ../../dist/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ../../dist/Payload/
          cd ../../dist
          zip -qr "knowpod-$VERSION-ios-unsigned.ipa" Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: knowpod-ios-${{ needs.version.outputs.version }}
          path: mobile/dist/*.ipa
          if-no-files-found: error

  esp32:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32-s3-epaper-397
            label: epaper-397
            chip: esp32s3
          - env: esp32-c6-epaper-154
            label: epaper-154
            chip: esp32c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        working-directory: esp32
        run: pio run -e ${{ matrix.env }}
      - name: Create merged firmware image
        working-directory: esp32
        run: |
          pip install esptool
          VERSION="${{ needs.version.outputs.version }}"
          BUILD=".pio/build/${{ matrix.env }}"
          FLASH_SIZE=$(grep -A5 '\[env:${{ matrix.env }}\]' platformio.ini | grep flash_size | awk -F= '{print $2}' | tr -d ' ')
          mkdir -p ../dist
          # Both chips boot from 0x0 (bootloader), 0x8000 (partition table), 0x10000 (app)
          python -m esptool --chip ${{ matrix.chip }} merge_bin -o "../dist/knowpod-$VERSION-${{ matrix.label }}.bin" \
            --flash_mode dio --flash_size "$FLASH_SIZE" \
            0x0 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0x10000 "$BUILD/firmware.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: knowpod-firmware-${{ needs.version.outputs.version }}-${{ matrix.label }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build, android, ios, esp32]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: knowpod ${{ needs.version.outputs.version }}
          files: dist/*
