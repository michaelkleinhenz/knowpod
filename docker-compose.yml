# knowpod-service full stack: a single app container (Go backend with the React SPA embedded)
# and MongoDB as a single-node replica set (required for multi-document transactions).
# Configuration is exclusively via environment variables.

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Idempotently initiate the single-node replica set, then report health once it is up.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  # Single binary: serves the embedded web UI and the API from the same origin/port.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGO_DB: "knowpod"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
    ports:
      - "8080:8080"

volumes:
  mongo_data:
